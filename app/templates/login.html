<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Entrar — Money App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/css/style.css" />
    <link rel="stylesheet" href="/static/css/auth.css" />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a href="/" class="logo" style="text-decoration: none; color: inherit;">Money App</a>
        <nav class="menu">
          <a href="/cadastro">Criar conta</a>
        </nav>
      </div>
    </header>

    <main class="auth-page">
      <div class="auth-card">
        <h1 class="auth-titulo">Entrar</h1>
        <p class="auth-subtitulo">Bem-vindo de volta ao Money App.</p>

        {% if erro %}
        <div class="auth-erro" role="alert">{{ erro }}</div>
        {% endif %}

        <form method="POST" action="/login" class="auth-form" id="formLogin">
          <div class="auth-campo">
            <label for="email">E-mail</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="seu@email.com"
              required
              autocomplete="email"
            />
          </div>

          <div class="auth-campo">
            <label for="senha">Senha</label>
            <input
              type="password"
              id="senha"
              name="senha"
              placeholder="Sua senha"
              required
              autocomplete="current-password"
            />
          </div>

          <button type="submit" class="auth-btn">Entrar</button>
        </form>

        <p class="auth-link">
          Ainda não tem conta? <a href="/cadastro">Criar conta</a>
        </p>
      </div>
    </main>
  </body>
</html>
