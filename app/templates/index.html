<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Busca de Ativos</title>
    <link rel="stylesheet" href="/static/css/style.css?v={{ asset_version }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="header">
      <div class="container">
        <a href="/" class="logo" aria-label="Money App - Página inicial">Money App</a>

        <nav class="menu" aria-label="Conta">
          {% if usuario %}
            <div class="usuario-resumo" title="{{ usuario.nome }}">
              <span class="usuario-avatar" aria-hidden="true">
                {{ usuario.nome[:1] | upper }}
              </span>
              <span class="usuario-nome">{{ usuario.nome.split()[0] }}</span>
            </div>
            <form method="POST" action="/logout" class="form-logout">
              <button type="submit" class="btn-logout">Sair</button>
            </form>
          {% else %}
            <a href="/login" class="menu-link">Entrar</a>
            <a href="/cadastro" class="menu-link menu-link--primary">Criar conta</a>
          {% endif %}
        </nav>
      </div>
    </header>

    <main class="home-page">
      <section class="home-hero" aria-labelledby="home-title">
        <div class="home-hero__content">
          <p class="home-eyebrow">Mercado brasileiro</p>

          <h1 id="home-title" class="home-title">
            Pesquise e analise <span class="home-title__accent">ativos da B3</span>
          </h1>

          <p class="home-subtitle">
            Cotações, gráficos e fundamentos em um só lugar.
          </p>

          <form id="formBusca" class="home-search" role="search">
            <label for="tickerInput" class="home-search__label">Buscar ativo</label>

            <div class="home-search__controls">
              <input
                type="text"
                id="tickerInput"
                class="home-search__field"
                placeholder="Digite um ticker, ex.: PETR4"
                autocomplete="off"
                autocapitalize="characters"
                spellcheck="false"
                required
              />
              <button type="submit" class="home-search__button">Buscar</button>
            </div>
          </form>

          <nav class="home-examples" aria-label="Exemplos de busca">
            <span class="home-examples__label">Exemplos de busca</span>
            <div class="home-examples__list">
              <a class="home-examples__link" href="/ativo/VALE3">VALE3</a>
              <a class="home-examples__link" href="/ativo/PETR4">PETR4</a>
              <a class="home-examples__link" href="/ativo/ITUB4">ITUB4</a>
              <a class="home-examples__link" href="/ativo/BBDC4">BBDC4</a>
              <a class="home-examples__link" href="/ativo/WEGE3">WEGE3</a>
            </div>
          </nav>
        </div>
      </section>
    </main>

    <script src="/static/js/home.js?v={{ asset_version }}"></script>
  </body>
</html>
